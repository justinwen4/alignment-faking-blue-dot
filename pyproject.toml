[project]
name = "alignment-faking"
version = "0.1.0"
description = "Inducing alignment faking via targeted fine-tuning (Blue Dot grant)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "datasets",
    "httpx",
    "jinja2",
    "openai",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "together",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
merge = [
    "peft",
    "torch",
    "transformers",
    "accelerate",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
